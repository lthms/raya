name: Provision
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency: provision
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - run: ./image/build.sh
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: image
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_hcloud_cluster_token: ${{ secrets.HCLOUD_CLUSTER_TOKEN }}
      TF_VAR_betterstack_token: ${{ secrets.BETTERSTACK_TOKEN }}
      TF_VAR_gcp_terraform_credentials: ${{ secrets.GCP_TERRAFORM_CREDENTIALS }}
      TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform init
      - run: terraform apply -auto-approve -var-file prod.tfvars
