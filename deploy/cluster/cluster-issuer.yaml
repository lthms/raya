# The single issuer every application on `raya` asks for a certificate from.
# `ClusterIssuer` rather than `Issuer`, so a namespace does not need one of its
# own — and does not get to name a different ACME account.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: ${acme_email}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: ${gcp_project}

---
# The bootstrap issuer used for the `oidc` name is its only customer. DNS-01
# needs a GCP credential, which the cluster only obtains by federating against.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    email: ${acme_email}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-http01-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
