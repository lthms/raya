---
# A Flux HelmRelease rather than the helm.cattle.io HelmChart the rest of
# deploy/ uses, to stay consistent with deploy/postgresql, which needs a
# postRenderer the k3s helm controller cannot express.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"  # CNPG 1.30
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 24h
  values:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
