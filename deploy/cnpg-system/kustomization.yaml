---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  # The plugin talks to the operator over a local gRPC socket, so it has to
  # share its namespace. The release manifest already pins cnpg-system, which
  # is also this Kustomization's targetNamespace.
  - plugin-barman-cloud.yaml
