# The `default` namespace, which holds what has to live beside the `kubernetes`
# Service.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: default
spec:
  interval: 10m
  retryInterval: 1m
  dependsOn:
    - name: cluster
  path: ./deploy/default
  targetNamespace: default
  prune: true
  sourceRef:
    kind: GitRepository
    name: raya
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
