---
# Publishes the two OpenID Connect discovery documents the API server serves, so
# an outside verifier can check a token this cluster signed. Only those two
# paths, matched exactly: a prefix rule here would put the whole API server
# behind Traefik.
#
# See deploy/cluster/oidc.yaml for the binding that lets them be read.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oidc-discovery
  annotations:
    # HTTP-01, not the DNS-01 default: this certificate is what makes DNS-01
    # possible. See deploy/cluster/cluster-issuer.yaml.
    cert-manager.io/cluster-issuer: letsencrypt-http01
    # And the A record is Terraform's for the same reason. See dns.tf.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${oidc_hostname}
      secretName: oidc-tls
  rules:
    - host: ${oidc_hostname}
      http:
        paths:
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend: { service: { name: apiserver, port: { number: 6443 } } }
          - path: /openid/v1/jwks
            pathType: Exact
            backend: { service: { name: apiserver, port: { number: 6443 } } }
---
# The API server, addressed through a Service of our own. Traefik reads its
# `service.*` annotations off the Service and never off the Ingress, and the
# built-in `kubernetes` Service cannot carry them: it is apiserver-managed, so
# Flux would end up owning -- and pruning -- a core object.
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: default-apiserver@kubernetescrd
spec:
  ports:
    - port: 6443
---
# No selector, so the endpoint is written by hand: the control plane is a
# singleton, and its address is one of Terraform's naming decisions. See
# local.control_plane_private_ip in network.tf.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: apiserver
  labels:
    kubernetes.io/service-name: apiserver
addressType: IPv4
ports:
  - port: 6443
endpoints:
  - addresses:
      - ${control_plane_private_ip}
    conditions:
      ready: true
---
# Traefik reaches the API server over HTTPS with the cluster's own CA, which no
# public bundle knows. kube-root-ca.crt is projected into every namespace, so
# there is nothing to create.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: apiserver
spec:
  serverName: kubernetes.default.svc
  rootCAs:
    - configMap: kube-root-ca.crt
