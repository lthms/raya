# Deletes the `Node` objects of agents that no longer exist.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-reaper
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-reaper
subjects:
  - kind: ServiceAccount
    name: node-reaper
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-reaper
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: node-reaper
          restartPolicy: Never
          containers:
            - name: reaper
              image: alpine/k8s:1.36.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  expected="$(jq -r '.agents | length' /fleet/agents.json)"
                  case "${expected}" in
                      ''|*[!0-9]*)
                          echo "agents.json did not yield a count" >&2
                          exit 1
                          ;;
                  esac

                  echo "the fleet is ${expected} agent(s)"

                  mark="node-reaper.raya/surplus-since"

                  # One list, so every node is judged against the same snapshot.
                  nodes="$(kubectl get nodes -o json | jq -r --arg mark "${mark}" '
                      .items[]
                      | select(.metadata.name | test("^agent-[0-9]+$"))
                      | "\(.metadata.name) \(if .metadata.annotations[$mark]
                                             then "marked" else "unmarked" end)"
                  ')"

                  echo "${nodes}" | while read -r node state; do
                      [ -n "${node}" ] || continue

                      index="${node#agent-}"
                      if [ "${index}" -lt "${expected}" ]; then
                          if [ "${state}" = marked ]; then
                              echo "unmarking ${node}: the fleet claims it again"
                              kubectl annotate node "${node}" "${mark}-"
                          fi
                      elif [ "${state}" = marked ]; then
                          echo "deleting ${node}"
                          kubectl delete node "${node}" --ignore-not-found
                      else
                          echo "marking ${node} for deletion"
                          kubectl annotate node "${node}" \
                              "${mark}=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      fi
                  done
              volumeMounts:
                - name: fleet
                  mountPath: /fleet
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
          volumes:
            - name: fleet
              configMap:
                name: cluster-fleet

