apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system
spec:
  interval: 10m
  path: ./deploy/kube-system
  targetNamespace: kube-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: raya
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
