# external-dns watches Ingresses and Services, and writes the names they claim
# into the DNS zone. The address it writes is the one their load balancer
# reports, and Traefik's is a `LoadBalancer` that k3s' ServiceLB fills with the
# address of every node — so one name becomes one A record per node.
#
# Cloud DNS is one of the providers external-dns speaks natively, so there is no
# webhook sidecar here — only a service account key, scoped to the one zone.
# `--policy=sync` and the TXT registry are what let it delete again what it
# created.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  replicas: 1
  # Two replicas would race each other over the same records.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0
          args:
            - --source=ingress
            - --source=service
            # One filter per zone raya owns.
            - --domain-filter=ry.xmu.mx
            - --domain-filter=xmu.mx
            - --domain-filter=soap.coffee
            - --provider=google
            # We do not run inside the project, so it has to be named; and the
            # zone is public, which keeps a private zone of the same name from
            # ever being picked up by mistake.
            - --google-project=${gcp_project}
            - --google-zone-visibility=public
            # The TXT records record what this cluster owns, so `sync` only ever
            # deletes what this cluster created.
            - --registry=txt
            - --txt-owner-id=raya
            - --txt-prefix=%{record_type}.
            - --policy=sync
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/secrets/google/credentials.json
          volumeMounts:
            - name: credentials
              mountPath: /etc/secrets/google
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
      volumes:
        - name: credentials
          secret:
            secretName: gcp-dns

