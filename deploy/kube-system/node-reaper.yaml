# Deletes the `Node` objects of agents that no longer exist.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-reaper
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-reaper
subjects:
  - kind: ServiceAccount
    name: node-reaper
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: node-reaper
spec:
  # Every minute: a superseded Node holds its pods and its volumes hostage
  # until it is deleted, so the interval is the outage.
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: node-reaper
          restartPolicy: Never
          containers:
            - name: reaper
              image: alpine/k8s:1.36.2
              command: ["/bin/sh", "-c"]
              # Flux substitutes ${vars} into everything this Kustomization
              # builds, so the shell's own expansions are escaped as $$.
              # See deploy/kube-system.yaml.
              args:
                - |
                  set -eu

                  expected="$$(jq -r '.agents | length' /cluster/agents.json)"
                  case "$${expected}" in
                      ''|*[!0-9]*)
                          echo "agents.json did not yield a count" >&2
                          exit 1
                          ;;
                  esac

                  echo "the cluster has $${expected} agent(s)"

                  mark="node-reaper.raya/surplus-since"

                  # How long a surplus node is left alone before it is deleted.
                  # agents.json reaches this ConfigMap through Flux and the VM
                  # is destroyed by a terraform apply, and nothing orders those
                  # two: for a while the count says a node is gone while the
                  # node is still serving. Counting passes instead would tie the
                  # grace period to the cron interval, which is set for the
                  # superseded rule -- a minute of it, not fifteen.
                  grace=900

                  # One list, so every node is judged against the same snapshot.
                  # The sha suffix (see cluster.tf) is optional so that a node
                  # named under the previous scheme is still recognised, and
                  # reaped, on the apply that introduces the suffix.
                  nodes="$$(kubectl get nodes -o json \
                      | jq -r --arg mark "$${mark}" --argjson grace "$${grace}" '
                      .items[]
                      | select(.metadata.name | test("^agent-[0-9]+(-[0-9a-f]+)?$$"))
                      | (.metadata.annotations[$$mark]
                         | if . then fromdateiso8601 else null end) as $$since
                      | [ .metadata.name,
                          (.metadata.name | capture("^agent-(?<i>[0-9]+)") | .i),
                          (if any((.status.conditions // [])[];
                                  .type == "Ready" and .status == "True")
                           then "ready" else "notready" end),
                          (if $$since == null then "unmarked"
                           elif now - $$since > $$grace then "expired"
                           else "marked" end) ]
                      | @tsv
                  ')"

                  # Indices that something is actually running on right now.
                  live="$$(echo "$${nodes}" | awk -F'\t' '$$3 == "ready" { print $$2 }')"

                  echo "$${nodes}" | while IFS="$$(printf '\t')" \
                      read -r node index state mark_state; do
                      [ -n "$${node}" ] || continue

                      # Two Node objects claiming one index, one of them Ready:
                      # the other is the husk of a VM that was replaced. Nothing
                      # will revive it, and until it goes the scheduler keeps its
                      # pods and the attach/detach controller keeps its volumes
                      # bound to a server that no longer exists. No marking pass
                      # here -- that delay is downtime.
                      if [ "$${state}" = notready ] \
                          && echo "$${live}" | grep -qx "$${index}"; then
                          echo "deleting $${node}: superseded at index $${index}"
                          kubectl delete node "$${node}" --ignore-not-found
                          continue
                      fi

                      if [ "$${index}" -lt "$${expected}" ]; then
                          if [ "$${mark_state}" != unmarked ]; then
                              echo "unmarking $${node}: the cluster claims it again"
                              kubectl annotate node "$${node}" "$${mark}-"
                          fi
                      elif [ "$${mark_state}" = expired ]; then
                          echo "deleting $${node}: surplus for over $${grace}s"
                          kubectl delete node "$${node}" --ignore-not-found
                      elif [ "$${mark_state}" = unmarked ]; then
                          echo "marking $${node} for deletion"
                          kubectl annotate node "$${node}" \
                              "$${mark}=$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      fi
                  done
              volumeMounts:
                - name: cluster
                  mountPath: /cluster
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
          volumes:
            - name: cluster
              configMap:
                name: cluster-fleet

