---
# WAL archiving alone restores nothing - it only replays forward from a base
# backup. Nightly at 03:00 (the schedule is 6 fields, seconds first).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgresql-nightly
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
