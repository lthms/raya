---
# Connection settings to be handed over to ext-postgres-operator. Defined as a
# Secret because the operator stores its configuration in one.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
type: Opaque
stringData:
  POSTGRES_HOST: postgresql-rw:5432
  POSTGRES_URI_ARGS: sslmode=disable
  POSTGRES_DEFAULT_DATABASE: postgres
