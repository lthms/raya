# The Cloud DNS key cert-manager writes records with, belonging to a service
# account IAM grants `dns.admin` on one project and nothing else. Kept in a
# manifest of its own so the file carrying it is the only one that has to be
# 0600.
#
# `data` rather than `stringData`: Terraform hands the key over base64-encoded
# already, which is exactly what this field wants.
---
# Read by the ClusterIssuer's DNS-01 solver; see cluster-issuer.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: gcp-acme-dns
  namespace: kube-system
type: Opaque
data:
  credentials.json: "{{ gcp_acme_dns_credentials }}"

