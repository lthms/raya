# The Cloud DNS keys the two components that write records authenticate with,
# each belonging to a service account IAM grants `dns.admin` on one project and
# nothing else. Kept in a manifest of their own so the file carrying them is the
# only one that has to be 0600.
#
# `data` rather than `stringData`: Terraform hands the keys over base64-encoded
# already, which is exactly what this field wants.
---
# Mounted by external-dns.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: gcp-dns
  namespace: kube-system
type: Opaque
data:
  credentials.json: "{{ gcp_dns_credentials }}"
---
# Read by the ClusterIssuer's DNS-01 solver; see cluster-issuer.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: gcp-acme-dns
  namespace: kube-system
type: Opaque
data:
  credentials.json: "{{ gcp_acme_dns_credentials }}"

