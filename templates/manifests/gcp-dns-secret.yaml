# The key external-dns.yaml mounts, belonging to a service account IAM grants
# `dns.admin` on one zone and nothing else. Kept in its own manifest so the file
# carrying it is the only one that has to be 0600.
#
# `data` rather than `stringData`: Terraform hands the key over base64-encoded
# already, which is exactly what this field wants.
apiVersion: v1
kind: Secret
metadata:
  name: gcp-dns
  namespace: kube-system
type: Opaque
data:
  credentials.json: "{{ gcp_dns_credentials }}"

